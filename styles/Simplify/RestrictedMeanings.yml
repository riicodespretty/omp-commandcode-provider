# STE rule 9.2
extends: substitution
message: "ASD-STE100 9.2: Use '%s' instead of '%s'."
link: https://asd-ste100.org/
level: warning
ignorecase: true
action:
  name: replace
swap:
  'a number of': 'some|many'
  '(?i)\babove\b(?=\s+(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten|zero))': 'more than'
  'as well as': 'and'
  'at this point in time': 'now'
  '(?i)\bbelow\b(?=\s+(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten|zero))': 'less than'
  '(?i)(?<=\b(?:table|figure|diagram|section|chart|graph|step|note|paragraph|page|list|text)\s+)below\b': 'that follows'
  'due to': 'because of'
  'goes down': 'decreases'
  'goes up': 'increases'
  'has the capability to': 'can'
  'in order to': 'to'
  'in the event that': 'if'
  'in the vicinity of': 'near'
  'is able to': 'can'
  'prior to': 'before'
  'subsequent to': 'after'
  'with the exception of': 'except for'
