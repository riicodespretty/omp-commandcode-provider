# STE general recommendation GR-8
extends: existence
message: "ASD-STE100 GR-8: Use the possessive form ('s or s') carefully or replace '%s' with an 'of the ...' construction."
link: https://asd-ste100.org/
level: suggestion
ignorecase: true
raw:
