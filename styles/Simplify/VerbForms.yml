  - '(?:have|has|had)\s+\w+ed(?=\s+(?:the|a|an|this|that|these|those|all|any|some|each|every|my|your|its|our|their|no|both|more|most|to|by|with|for|from|in|on|at|as|into|through|off|out|up|down|it|them|us|me|him|her)\b)'
