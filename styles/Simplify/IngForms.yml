# STE rule 3.5
---
extends: existence
message: "ASD-STE100 3.5: Use the '-ing' form only as a technical noun or as a modifier in a technical noun ('%s')."
link: https://asd-ste100.org/
level: warning
ignorecase: true
tokens:
  - '(?:by|while|after|before|when|for|without|instead\s+of|in\s+addition\s+to|upon|since|through|on|about|against|from|into|of|with)\s+(?!(?:according|anti-icing|bearing|binding|bonding|brazing|buffing|burnishing|bushing|casing|ceiling|chafing|clamping|cleaning|coating|conditioning|covering|defueling|degreasing|deicing|drilling|dressing|during|engineering|etching|fitting|following|fraying|fueling|galling|grinding|grounding|handling|housing|landing|lapping|lighting|lightning|lining|locking|lubricating|marking|mating|milling|missing|mounting|opening|packaging|packing|painting|plating|polishing|reading|reaming|remaining|rigging|routing|sanding|sealing|servicing|setting|shielding|shipping|soldering|something|spring|string|testing|threading|troubleshooting|tubing|warning|welding|wiring)\b)\w+ing'
  - '(?:^|(?<=[.!?:]\s+))(?!(?:according|anti-icing|bearing|binding|bonding|brazing|buffing|burnishing|bushing|casing|ceiling|chafing|clamping|cleaning|coating|conditioning|covering|defueling|degreasing|deicing|drilling|dressing|during|engineering|etching|fitting|following|fraying|fueling|galling|grinding|grounding|handling|housing|landing|lapping|lighting|lightning|lining|locking|lubricating|marking|mating|milling|missing|mounting|opening|packaging|packing|painting|plating|polishing|reading|reaming|remaining|rigging|routing|sanding|sealing|servicing|setting|shielding|shipping|soldering|something|spring|string|testing|threading|troubleshooting|tubing|warning|welding|wiring)\b)\w+ing'
