# STE rules 7.1, 7.2, 7.3
extends: existence
message: "ASD-STE100 7.1: a hazard statement must start with an approved risk label (WARNING, CAUTION, DANGER, NOTICE) and state the risk: '%s'."
link: https://asd-ste100.org/
level: suggestion
scope: paragraph
ignorecase: true
raw:
  - '(?i)^(?!\s*(?:WARNING|CAUTION|DANGER|NOTICE)\b)[\s\S]*?\b(electric\s+shock|can\s+kill\b|(?:can|will|could|may|might)\s+(?:cause|result\s+in)\s+(?:(?:serious|fatal|permanent|severe)\s+)?(?:death|injur(?:y|ies)|burns?|blindness|explosion|suffocation|poisoning)|(?:poisonous|toxic)\s+(?:gas|fumes?|vapors?|liquid|chemicals?|substances?|materials?)|(?:risk|danger)\s+of\s+(?:electric\s+shock|explosion|injur(?:y|ies)|death|burns?|fire|blindness|suffocation|poisoning)|(?:fatal|lethal|severe|serious)\s+injur(?:y|ies)|(?:fumes?|vapors?)\s+(?:are|can\s+be)\s+poisonous)\b'
