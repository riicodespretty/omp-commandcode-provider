StylesPath = styles

MinAlertLevel = warning

Vocab = Base

Packages = Google, write-good, proselint, neighbor, alex, Readability, NoAnimalViolence

[*.md]
BasedOnStyles = Vale, Simplify, Google, write-good, proselint, neighbor, alex, Readability, NoAnimalViolence
# Spaced em-dashes are this project's prose style.
Google.EmDash = NO
# This document is descriptive prose, so the descriptive sentence-length rule
# applies and the procedural one is switched off to avoid double-reporting.
Simplify.SentenceLengthProcedural = NO
# alex's profanity detector flags technical tokens ("period", "failure",
# "remains") as potentially profane; it is not useful signal for this domain.
alex.ProfanityUnlikely = NO
# Readability grades are whole-document metrics, not per-line prose fixes.
Readability.FleschKincaid = NO
Readability.FleschReadingEase = NO
Readability.ColemanLiau = NO
Readability.LIX = NO
Readability.SMOG = NO
Readability.GunningFog = NO
Readability.AutomatedReadability = NO
